[package]
name = "fints"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Product-neutral FinTS 3.0 PIN/TAN client"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
encoding_rs = "0.8.35"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
