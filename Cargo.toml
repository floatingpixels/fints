[package]
name = "fints"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Product-neutral FinTS 3.0 PIN/TAN client"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Supported, opt-in, value-free structural diagnostics. Default builds carry no
# diagnostic code or storage; fact shapes are explicitly unstable.
diagnostics = []
# Internal harness entry points for the separate owner-run fuzz crate.
fuzzing = []

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
encoding_rs = "0.8.35"
quick-xml = { version = "0.41", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.53", default-features = false, features = ["macros", "rt"] }
