name: Release

# release-plz opens and maintains a release PR from Conventional Commits
# (version bump + changelog). Merging that PR is the owner's release decision;
# the release job then tags the version and publishes a GitHub release.
# cargo publish stays impossible: the manifest restricts publishing to a
# non-configured registry and release-plz is configured git-only.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # A RELEASE_PLZ_TOKEN PAT lets CI run on the release PR; the default
          # token works but GitHub then skips workflows on PRs it creates.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
