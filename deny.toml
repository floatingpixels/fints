# cargo-deny configuration: security advisories and dependency licenses.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only, so the crate itself stays cleanly licensable.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# The fints crate itself is restricted to the non-configured fints-internal
# registry and not yet licensed; treat it as private while still enforcing the
# allowlist on every dependency.
private = { ignore = true, registries = ["fints-internal"] }

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
